server:
  port: 8080

spring:
  application:
    name: Exam-Practice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "ExamPracticeSuperSecretKeyForJwtSigning2026MustBeAtLeast256BitsLong!!"
    expiration-ms: 86400000
