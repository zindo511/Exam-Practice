server:
  port: 8080

spring:
  application:
    name: Exam-Practice
  autoconfigure:
    # Không tạo user mặc định với mật khẩu sinh ngẫu nhiên: user nằm trong bảng identity_user,
    # xác thực bằng JWT (identity.internal.SecurityConfig).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    # Nạp biến từ file .env ở thư mục chạy ứng dụng (nếu có). Biến môi trường thật được ưu tiên hơn.
    # Danh sách biến: .env.example
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  data:
    web:
      pageable:
        # ADR-0009: page bắt đầu từ 0, size mặc định 20; size lớn hơn 100 bị hạ xuống 100.
        default-page-size: 20
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Để trống nếu thiếu biến, để JwtService báo rõ "chưa được cấu hình" và dừng khởi động.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  examination:
    job:
      # Job mở kỳ thi, chốt bài hết giờ, đóng kỳ thi (ADR-0013). Test tắt job và tự gọi ExaminationJob.runOnce.
      enabled: true
      # Khoảng nghỉ giữa hai lượt chạy (ISO-8601)
      interval: PT30S
