server:
  port: 8080

spring:
  application:
    name: Exam-Practice
  config:
    # Nạp biến từ file .env ở thư mục chạy ứng dụng (nếu có). Biến môi trường thật được ưu tiên hơn.
    # Danh sách biến: .env.example
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_practice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
